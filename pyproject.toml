[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arg-gnn"
version = "0.0.1"
description = "Research on neural operators over interval-bearing graph collections"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
arggnn-benchmark = "arggnn.benchmarking.cli:main"
