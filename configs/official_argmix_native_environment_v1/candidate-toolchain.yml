# UNSOLVED candidate Conda base. This is not a lock or an exact author environment.
# Root must resolve/freeze the full linux-64 closure before creating a prefix.
# Torch, libtorch and torchvision deliberately belong to the separate wheel profile.
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.13
  - rust=1.90.0
  - clang=21.1.8
  - c-compiler=1.11.0
  - binutils=2.45.1
  - maturin=1.14.1
  - hdf5=1.14.6
  - pkg-config>=0.29.2,<0.30
  - pip>=25.2,<26
  - openblas>=0.3.31,<0.4
  - patchelf
  - bcftools>=1.22,<2
  - plink2>=2.0.0a.6.9,<3
